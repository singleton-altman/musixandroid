name: Build Android APK

on:
  push:
    branches: [main, master]
    # Docs-only pushes don't change the app; skip the build for them.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # 发布仓库：由仓库变量 RELEASE_REPO 决定（已配置为 xijin285/MusicXApp），
  # APK 和 Release 通过 RELEASE_REPO_TOKEN 密钥发到那边；
  # 变量未设置时回落为当前仓库。
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
  # 发布仓库里的目标分支，Release 的标签会指向它（仓库至少要有一个提交）。
  RELEASE_TARGET: ${{ vars.RELEASE_TARGET || 'main' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: release notes are generated from the commits
          # since the previous `build-N` tag.
          fetch-depth: 0

      - name: Prepare app version
        run: python3 scripts/prepare_app_version.py --run-number "$GITHUB_RUN_NUMBER"

      - name: Build bundled update diary
        run: |
          mkdir -p assets
          python3 scripts/build_changelog.py \
            --output assets/changelog.md \
            --current-tag "$APP_BUILD_TAG" \
            --current-date "$(date -u +%Y-%m-%d)" \
            --current-run-number "$APP_BUILD_NUMBER"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Complete Android project files
        run: flutter create --empty --platforms=android --org com.musix --project-name musix .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        shell: bash
        run: |
          # 测试脚本只保留在本地仓库，公开仓库里没有；有则跑，无则跳过。
          if [ -d test ] && compgen -G "test/*_test.dart" > /dev/null; then
            flutter test
          else
            echo "No Flutter tests in repo — skipped."
          fi
          if compgen -G "scripts/test_*.py" > /dev/null; then
            python3 -m unittest discover -s scripts -p 'test_*.py'
          else
            echo "No Python tests in repo — skipped."
          fi

      - name: Restore fixed release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 repository secret. Refusing to use debug signing.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'musix-release.p12'
          path.write_bytes(base64.b64decode(encoded, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY

      - name: Build release APK with fixed signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-name="$APP_BUILD_NAME"
          --build-number="$APP_BUILD_NUMBER"
          --dart-define="APP_DISPLAY_VERSION=$APP_DISPLAY_VERSION"
          --dart-define="RELEASE_REPO=$RELEASE_REPO"

      - name: Verify release signing certificate
        id: verify-signing
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee "$RUNNER_TEMP/apk-certificate.txt"
          python3 scripts/verify_apk_certificate.py "$RUNNER_TEMP/apk-certificate.txt" android/signing-certificate.sha256

      - name: Upload signing diagnostics on failure
        if: failure() && steps.verify-signing.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: apk-signing-diagnostics
          path: ${{ runner.temp }}/apk-certificate.txt
          if-no-files-found: warn

      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/musix-release.p12"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musix-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Generate release notes
        if: github.event_name == 'push'
        run: |
          python3 scripts/generate_release_notes.py \
            --build-tag "$APP_BUILD_TAG" \
            --commit "${GITHUB_SHA:0:7}" \
            --date "$(date -u +%Y-%m-%d)" \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # 发到发布仓库；RELEASE_REPO 未配置时就是当前仓库，行为与以前一致。
          repository: ${{ env.RELEASE_REPO }}
          # 跨仓库发布需要 PAT（contents: write）；同仓库时回落到内置令牌。
          token: ${{ secrets.RELEASE_REPO_TOKEN || github.token }}
          target_commitish: ${{ env.RELEASE_TARGET }}
          tag_name: ${{ env.APP_BUILD_TAG }}
          name: MusicX ${{ env.APP_DISPLAY_VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

      # 版本号里的 (NNN) 是按源码仓库里的 build-* 标签数出来的，所以即使
      # Release 发到了别的仓库，本地标签也要补上，否则序号会一直停在 001。
      - name: Tag build in source repo
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$APP_BUILD_TAG" >/dev/null 2>&1; then
            echo "Tag $APP_BUILD_TAG already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$APP_BUILD_TAG"
          git push origin "refs/tags/$APP_BUILD_TAG"
